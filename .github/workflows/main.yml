name: Build Ezan Vaktim Pro APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read-only Quran regression checks
        run: python3 scripts/check_quran_integrity.py
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EZAN-VAKTIM-PRO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
