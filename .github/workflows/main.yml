name: Build Ezan Vaktim Pro APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read-only Quran regression checks
        run: python3 scripts/check_quran_integrity.py
      - name: Prepare verified offline Arabic Quran
        run: python3 scripts/prepare_quran_asset.py
      - name: Check remote Quran recitation audio endpoints
        run: python3 scripts/check_audio_endpoints.py
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK output
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK (first attempt)
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: EZAN-VAKTIM-PRO-1.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Retry APK upload if needed
        if: steps.upload_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: EZAN-VAKTIM-PRO-1.0.0-APK-RETRY
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
